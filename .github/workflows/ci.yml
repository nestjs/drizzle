name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Verify the suite passes against the oldest supported Drizzle ORM
        # version, the latest v0.x release, and v1 (published under `rc`).
        drizzle-orm-version: ['0.35.x', '0.45.x', 'rc']
    # Most of the suite runs against PGlite (in-process Postgres) and libSQL.
    # The driver tests also need PostgreSQL and MySQL, on the same host ports
    # as docker-compose.yml.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U root -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Drizzle ORM ${{ matrix.drizzle-orm-version }}
        # Unlike `npm pkg set`, which leaves the locked version in place for a
        # dist-tag such as `rc`, this resolves both tags and ranges.
        run: npm install --no-save drizzle-orm@${{ matrix.drizzle-orm-version }}
      - name: Report installed Drizzle ORM version
        # `require('drizzle-orm/package.json')` is blocked by v1's exports map,
        # so read the manifest from disk directly.
        run: node -e "console.log('drizzle-orm', JSON.parse(require('fs').readFileSync('./node_modules/drizzle-orm/package.json','utf8')).version)"
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e
